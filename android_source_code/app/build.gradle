plugins {
    id 'com.android.application'
}

android {
    namespace "com.deepseek.dshcloud"
    compileSdk 34

    defaultConfig {
        applicationId "com.deepseek.dshcloud"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "4.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
